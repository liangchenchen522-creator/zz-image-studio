<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品库</title><link rel="stylesheet" href="./product-cards.css?v=mobile-20261115"><link rel="stylesheet" href="./studio-cloud.css?v=1"></head><body><header><a href="./studio.html">← 返回图片作品</a><h1>产品库</h1><a href="./product-cards.html">新建产品图</a></header><main><p>先把已有的成品图片和商品资料存放在这里，选中后可以加入图片作品。完整编辑稿也可以从现有图片作品复制进来。</p><div class="editor-grid"><details id="libraryForm" open><summary>＋ 添加商品 / 从已有作品复制</summary><aside><h2 id="formTitle">添加到产品库</h2><label>从已有产品复制<select id="existing"></select></label><button id="copyExisting">复制到产品库</button><hr><form id="form"><label>商品名称<input name="name" required></label><label>品牌<input name="brand"></label><label>规格<input name="specification"></label><label>适用年龄<input name="ageRange"></label><label>价格<input name="price" type="number" min="0" step="0.01"></label><label>介绍<textarea name="description" rows="4"></textarea></label><label>成品图片或主图<input name="image" type="file" accept="image/*"></label><p>上传成品图片会保留为图片素材；完整可编辑稿请使用上方“从已有产品复制”。</p><button type="submit" id="submitProduct">添加到产品库</button><button type="button" id="cancelEdit" hidden>取消编辑</button></form><p id="status" role="status">正在读取产品库…</p></aside></details><section><div class="pair"><input id="search" placeholder="搜索产品库商品"><button id="import">将选中商品加入图片作品</button></div><div id="list" class="types library-grid"></div></section></div></main><script src="./studio-cloud-config.js"></script><script src="./studio-cloud-api.js?v=2"></script><script src="./studio-image-upload.js?v=mobile-20261115"></script><script src="./product-library-manager.js?v=mobile-20261115"></script></body></html>
