<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择产品卡片类型</title><link rel="stylesheet" href="./product-cards.css?v=mobile-20261115"><link rel="stylesheet" href="./studio-cloud.css?v=1"></head>
<body><header><a href="./studio.html">← 返回图片作品</a><h1>新建产品图</h1><div id="actions" hidden><button id="save">保存草稿</button><button id="preview">预览成品</button><button id="export">导出 PNG</button></div></header>
<main><section id="chooser"><p id="chooserStatus" role="status"></p><div id="templateCategories"><h2>第一步 · 选择模板分类</h2><p>原有模板完整保留，四款新主题单独归类。</p><div class="template-categories"><button class="category-card" data-category="original"><span class="category-symbol">01 / CLASSIC</span><strong>原有模板</strong><span>原版单品图片、编号合集、产品对比、阶段系列、细节模块与主图信息块。</span><small>进入选择具体模板 →</small></button><button class="category-card creative-category" data-category="creative"><span class="category-symbol">02 / CREATIVE</span><strong>四款主题模板</strong><span>奶油手账、蓝黄看板、Bento 产品档案、留白杂志。</span><small>进入选择具体模板 →</small></button></div></div><div id="templateChoices" hidden><button id="backCategories">← 返回模板分类</button><p class="template-breadcrumb">新建产品图 / <span id="categoryName"></span></p><h2>第二步 · 选择具体模板</h2><p id="categoryDescription"></p><div id="types" class="types"></div></div></section>
<section id="editor" hidden data-mobile-view="edit"><nav class="mobile-editor-tabs" aria-label="手机编辑切换"><button type="button" data-editor-tab="edit" aria-pressed="true">编辑内容</button><button type="button" data-editor-tab="preview" aria-pressed="false">查看画面</button></nav><p id="saveState" role="status">草稿已同步</p><div class="editor-grid"><aside><button id="back">← 重新选择类型</button><h2 id="modeTitle"></h2><label>卡片标题<input id="title" placeholder="例如：宝宝洗护系列"></label><label>品牌<input id="brand"></label><label>顶部说明<textarea id="intro" rows="2"></textarea></label><label id="heroLabel" hidden>商品主图<input id="heroUpload" type="file" accept="image/*"><img id="heroThumb" class="thumb" alt="主图预览"></label>
<div class="pair"><label>宽度<input id="width" type="number" min="600" max="3000" value="1080"></label><label>高度<input id="height" type="number" min="600" max="4000" value="1440"></label></div>
<label>整体视觉风格<select id="visualStyle"><option value="auto">使用这类卡片的专属风格</option><option value="grid">柔彩选品清单</option><option value="compare">蓝白资料表</option><option value="stages">暖奶油成长系列</option><option value="details">极简细节画册</option><option value="modules">蓝黄便签信息板</option></select><small>同时改变卡片形状、边框、字体气质、色块和装饰。</small></label>
<div class="pair"><label>底色<input id="background" type="color" value="#fffaf0"></label><label>正文字号<input id="fontSize" type="number" min="14" max="38" value="22"></label></div>
<label>Logo<select id="logo"></select></label><label><input id="watermark" type="checkbox" checked> 显示淡水印</label><label>水印透明度<input id="opacity" type="range" min="0" max="20" value="7"></label>
<p id="creativeHelp" hidden>手账：第1张为商品图，第2张为实拍；看板：第1张为实拍，第2张为细节。Bento 可放1～4张照片，前两个信息块显示双栏说明；杂志使用第1张主图，介绍中的空行用于分栏。成品价格统一使用下面的“参考价格”。</p>
<div class="pair"><label>参考价格<input id="cardPrice" placeholder="可留空"></label><label>更新日期<input id="cardDate" type="date"></label><label>适用年龄<input id="cardAge"></label><label>商品编号<input id="cardCode"></label></div><label>推荐标签<input id="cardTag" placeholder="例如：好物笔记、本周分享"></label>
<div class="warehouse"><h3>从产品库选取</h3><p>选择产品库或图片作品中的已有商品，将资料作为副本加入这张卡片。</p><input id="warehouseSearch" placeholder="搜索品牌或商品名称"><select id="warehouseSelect"></select><button id="warehouseAdd">＋ 加入当前卡片</button></div>
<label id="rowsLabel" hidden>对比项目（每行一个，最多6项）<textarea id="rows" rows="4">适用年龄
规格
主要用途
特点</textarea></label><h3 id="itemsTitle">商品</h3><div id="items"></div><button id="add">＋ 添加商品</button><label>底部备注<textarea id="note" rows="2" placeholder="按需要填写注意事项或询价说明"></textarea></label><p id="status" role="status">正在准备编辑器…</p></aside>
<section class="preview-area"><div class="preview-bar"><strong>实时预览</strong><span id="dimensions"></span></div><label class="preview-zoom">画面大小<input id="canvasZoom" type="range" min="50" max="200" value="100"><span id="zoomLabel">100%</span></label><div class="canvas-viewport"><canvas id="canvas" width="1080" height="1440"></canvas></div></section></div></section></main>
<dialog id="dialog"><button id="close">返回编辑 ×</button> <button id="shareResult" hidden>保存到手机/分享</button> <a id="downloadResult">下载 PNG</a><p>iPhone 请点“保存到手机/分享”，再选择“存储图像”；也可长按图片保存。</p><img id="result" alt="成品预览"></dialog>
<script src="./studio-cloud-config.js?v=1"></script><script src="./studio-cloud-api.js?v=2"></script><script src="./product-creative-templates.js?v=1"></script><script src="./studio-image-upload.js?v=mobile-20261115"></script><script src="./product-cards.js?v=mobile-20261115"></script></body></html>
